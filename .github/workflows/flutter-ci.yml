name: Flutter CI

# **Sur les PR seulement** (09/10/2026) : la fusion d'une PR verte rejouait
# exactement la même chaîne sur `main` — ~12 min de quota Actions par fusion,
# pour un verdict déjà rendu. L'organisation est sur le plan gratuit (2000
# minutes par mois pour les dépôts privés) et le quota a été épuisé.
on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Analyze & Test
    # **La machine qui exécute est une variable, pas une constante** — le quota Actions du plan
    # Free est épuisé jusqu'au 31/10/2026, et un runner auto-hébergé tourne sur le VPS
    # (`context#7`, `context/docs/CI-DE-SECOURS.md`). Supprimer la variable d'organisation
    # `CI_RUNNER` ramène tout sur les machines de GitHub, sans commit. Le repli garde
    # l'épinglage voulu : le passage à Ubuntu 26.04 du 19 octobre doit rester un choix.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Le magasin local est la première dépendance du dépôt qui peut casser le
      # web sans casser autre chose : un `import 'package:drift/native.dart'`
      # (dart:ffi) glissé dans `lib/` compile parfaitement sur mobile et rend le
      # web injoignable. `flutter analyze` ne le voit pas — seule une
      # compilation web le voit.
      #
      # Le second risque, lui, est couvert par `flutter test` :
      # `test/data/local/web_assets_test.dart` apparie sqlite3.wasm et
      # drift_worker.js à pubspec.lock.
      - name: Build web
        run: flutter build web --dart-define=API_BASE_URL=https://eenv.brainsial.com

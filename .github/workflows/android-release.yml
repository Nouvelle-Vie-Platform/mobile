name: APK sur tag

# Un tag `vX.Y.Z` poussé construit les APK et les publie dans une Release GitHub.
#
# **Le tag fixe la version** : `v1.2.0` donne `versionName` 1.2.0, sans toucher
# au pubspec. Le numéro de build est le numéro de run de ce workflow.
#
# **Un APK par type de processeur** (#159) : `--split-per-abi`, limité à
# arm64-v8a (téléphones récents) et armeabi-v7a (anciens téléphones 32 bits) —
# pas x86_64, qui ne sert qu'aux émulateurs. Chacun pèse le tiers de l'APK
# « universel » d'avant. Flutter donne à chacun le `versionCode`
# `<rang de l'ABI> × 1000 + numéro de build` (armeabi-v7a 1, arm64-v8a 2 :
# `FlutterPluginConstants.ABI_VERSION`) — croissant d'un run à l'autre pour une
# même ABI, et toujours plus haut que les APK universels d'avant (versionCode =
# numéro de run). Tant que le numéro de run reste sous 1000, l'APK arm64 d'un
# run passe aussi au-dessus de l'armeabi-v7a de n'importe quel run : un
# téléphone 64 bits qui aurait pris l'APK 32 bits monte sans encombre. D'où le
# garde-fou de la première étape.
#
# **Signé avec la clé de release** (#159), reconstituée depuis quatre secrets :
# `ANDROID_KEYSTORE_BASE64`, `ANDROID_KEYSTORE_PASSWORD`, `ANDROID_KEY_ALIAS`,
# `ANDROID_KEY_PASSWORD`. Même clé d'un tag à l'autre : la mise à jour
# s'installe par-dessus, sans rien effacer. **Sans ces secrets** (ou s'ils ne
# s'ouvrent pas), la construction retombe sur la clé de debug régénérée sur le
# runner, avec un avertissement visible : jamais d'échec pour ça, mais il faudra
# alors désinstaller avant d'installer — et le portail le dira.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Construire et publier l'APK
    runs-on: ubuntu-24.04
    steps:
      - name: Lire la version dans le tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # Trois nombres, rien d'autre : `versionName` s'affiche dans « À
          # propos », et le bandeau de mise à jour compare les versions segment
          # par segment — un `1.2.0-rc1` le rendrait muet.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag « $tag » invalide : attendu vX.Y.Z (ex. v1.2.0)."
            exit 1
          fi
          # Au-delà de 999, `1000 + n` (armeabi-v7a) rattraperait `2000 + 0`
          # (arm64-v8a) : l'ordre entre les deux ABI ne tiendrait plus. Ce jour-là,
          # il faudra un autre numéro de build — pas un APK au versionCode faux.
          if [ "$GITHUB_RUN_NUMBER" -ge 1000 ]; then
            echo "::error::Numéro de run ${GITHUB_RUN_NUMBER} ≥ 1000 : les versionCode par ABI se chevaucheraient (voir l'en-tête du workflow)."
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7

      # Le « Quoi de neuf » des fidèles s'écrit dans le message du tag annoté
      # (`git tag -a v1.4.0 -m "…"`, CLAUDE.md). Il ouvre les notes de la
      # Release et part au portail. Le texte ne passe que par un fichier, jamais
      # par `${{ }}` : il n'est jamais interprété par le shell.
      - name: Lire les notes du tag
        id: notes
        env:
          LC_ALL: C.UTF-8
        run: |
          tag="${GITHUB_REF_NAME}"
          file="${RUNNER_TEMP}/notes-du-tag.txt"
          : > "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          # `checkout` peut ne garder que le commit, pas l'objet tag annoté.
          git fetch --force --no-tags origin "refs/tags/${tag}:refs/tags/${tag}" || {
            echo "::warning title=Notes::tag ${tag} non rapatrié : Release et portail sans notes."
            exit 0
          }
          # Un tag léger n'a pas de message : `%(contents)` rendrait celui du
          # commit, qu'on ne veut surtout pas publier.
          if [ "$(git cat-file -t "refs/tags/${tag}")" != "tag" ]; then
            echo "Tag léger : pas de notes."
            exit 0
          fi
          # Le message entier moins sa signature éventuelle (PGP, SSH). Pas
          # `%(contents:subject)` : il recollerait en une ligne un premier
          # paragraphe écrit sur plusieurs.
          notes=$(git for-each-ref --format='%(contents)' "refs/tags/${tag}")
          sig=$(git for-each-ref --format='%(contents:signature)' "refs/tags/${tag}")
          [ -n "$sig" ] && notes="${notes%"$sig"}"
          notes="${notes#"${notes%%[![:space:]]*}"}"
          notes="${notes%"${notes##*[![:space:]]}"}"
          # Le portail refuse au-delà de 2000 caractères (422).
          if [ "${#notes}" -gt 2000 ]; then
            echo "::warning title=Notes::message du tag de ${#notes} caractères, tronqué à 2000."
            notes="${notes:0:2000}"
          fi
          printf '%s' "$notes" > "$file"
          echo "Notes du tag (${#notes} caractères) :"
          cat "$file"; echo

      # AGP 9 exige un JDK 17 au moins ; 21 est celui de la machine de dev
      # (CLAUDE.md, « Environnement »).
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # **La mémoire de Gradle, bornée pour la machine de la CI.** Le projet
      # réserve 8 Go de tas et 4 Go de métaspace (`android/gradle.properties`),
      # réglage pensé pour un poste de développement. Une machine GitHub de
      # dépôt privé n'a que 7 Go en tout : la compilation de release finissait
      # par épuiser la mémoire et Gradle était tué en plein build (code 143, ou
      # job disparu) — v1.4.0 et v1.4.3, deux fois. Les propriétés du dossier
      # utilisateur l'emportent sur celles du projet, sans toucher au poste.
      - name: Borner la mémoire de Gradle
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
          kotlin.daemon.jvmargs=-Xmx1g
          org.gradle.workers.max=2
          EOF

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Un tag ne publie jamais ce que la CI de `main` refuserait.
      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # La clé de release (#159), reconstituée dans un fichier temporaire du
      # runner — jamais dans le dépôt, effacé à la fin du job (`Effacer la clé`).
      # Elle est **ouverte** ici, avant la construction : un mot de passe ou un
      # alias faux devient un avertissement et un repli sur la clé de debug,
      # jamais une Release ratée.
      - name: Préparer la clé de signature
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          fallback() {
            echo "::warning title=Signature::$1 APK signés avec une clé de debug : il faudra désinstaller l'app avant de les installer."
            rm -f "$keystore"
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          }
          keystore="${RUNNER_TEMP}/release.jks"
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] \
            || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            fallback "Secrets de signature absents (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore" \
            || fallback "ANDROID_KEYSTORE_BASE64 n'est pas du base64 valide."
          keytool -list -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null 2>&1 \
            || fallback "Le keystore ne s'ouvre pas avec ce mot de passe et cet alias."
          # Un keystore PKCS12 (le défaut de `keytool`) n'a qu'un mot de passe :
          # `keytool` ignorerait un mot de passe de clé différent, Gradle non.
          type=$(keytool -list -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" \
            2>/dev/null | sed -n 's/^Keystore type: //p')
          if [ "$type" = "PKCS12" ] \
            && [ "$KEY_PASSWORD" != "$KEYSTORE_PASSWORD" ]; then
            fallback "Keystore PKCS12 : ANDROID_KEY_PASSWORD doit valoir ANDROID_KEYSTORE_PASSWORD."
          fi
          # Un keystore JKS peut en avoir deux : la clé doit s'ouvrir aussi.
          keytool -certreq -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" > /dev/null 2>&1 \
            || fallback "La clé « ${KEY_ALIAS} » ne s'ouvre pas avec ANDROID_KEY_PASSWORD."
          echo "stable=true" >> "$GITHUB_OUTPUT"
          echo "path=$keystore" >> "$GITHUB_OUTPUT"

      # `android/app/build.gradle.kts` lit la clé dans ces variables ; un chemin
      # vide le fait signer avec la clé de debug.
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          flutter build apk --release --split-per-abi
          --target-platform android-arm,android-arm64
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.code }}
          --dart-define=API_BASE_URL=https://eenv.brainsial.com

      # Les deux APK doivent porter **le même certificat** : c'est lui que le
      # résumé du run affiche, pour le comparer d'un tag à l'autre.
      - name: Nommer les APK et lire leur certificat
        id: apk
        env:
          STABLE: ${{ steps.signing.outputs.stable }}
          EXPECTED: ${{ vars.EXPECTED_CERT_SHA256 }}
        run: |
          set -o pipefail
          # `apksigner` : celui du PATH, sinon le plus récent du SDK qui existe
          # vraiment (#163 — l'ancienne recherche prenait le dernier dossier de
          # build-tools sans vérifier qu'il contenait l'outil, et un échec passait
          # en silence derrière le `sed`).
          apksigner=$(command -v apksigner || true)
          if [ -z "$apksigner" ]; then
            apksigner=$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/nonexistent}}/build-tools" \
              -maxdepth 2 -name apksigner -type f 2>/dev/null | sort -V | tail -1 || true)
          fi
          [ -n "$apksigner" ] || { echo "::error title=Certificat::apksigner introuvable (ANDROID_HOME=${ANDROID_HOME:-vide})."; exit 1; }
          echo "apksigner : ${apksigner}"
          files=""
          certs=""
          for abi in arm64-v8a armeabi-v7a; do
            file="nouvelle-vie-${{ steps.version.outputs.name }}-${abi}.apk"
            mv "build/app/outputs/flutter-apk/app-${abi}-release.apk" "$file"
            if ! out=$("$apksigner" verify --print-certs "$file" 2>&1); then
              echo "$out"
              echo "::error title=Certificat::apksigner refuse ${file}."
              exit 1
            fi
            # « Signer #1 certificate SHA-256 digest: … », « Signer (minSdkVersion=…)
            # certificate SHA-256 digest: … », ou, depuis les build-tools 37,
            # « V2 Signer: certificate SHA-256 digest: … » selon la version d'apksigner.
            # Un motif ancré sur `^Signer` ratait cette dernière forme : v1.3.1 a publié
            # un certificat vide, et v1.4.0 a échoué sur la garde qui l'interdit.
            cert=$(printf '%s\n' "$out" \
              | sed -n 's/.*[Ss]igner[^:]*:\{0,1\} *certificate SHA-256 digest: *//p' | head -1)
            if [ -z "$cert" ]; then
              echo "$out"
              echo "::error title=Certificat::certificat illisible pour ${file} : un certificat vide n'est jamais une égalité."
              exit 1
            fi
            echo "${file} : $(du -h "$file" | cut -f1), certificat SHA-256 ${cert}"
            files="${files} ${file}"
            certs="${certs}${cert}"$'\n'
          done
          if [ "$(printf '%s' "$certs" | sort -u | wc -l)" -ne 1 ]; then
            echo "::error title=Certificat::les deux APK ne portent pas le même certificat."
            exit 1
          fi
          cert=$(printf '%s' "$certs" | head -1)
          # Quand la clé fixe a servi, le certificat doit être CELUI attendu
          # (variable du dépôt EXPECTED_CERT_SHA256, documentée dans
          # context/docs/SIGNATURE-ANDROID.md) : une autre clé posée par erreur
          # produirait des APK qui ne s'installent pas par-dessus.
          if [ "$STABLE" = "true" ] && [ -n "$EXPECTED" ] && [ "$cert" != "$EXPECTED" ]; then
            echo "::error title=Certificat::certificat ${cert}, attendu ${EXPECTED} : ce n'est pas la clé de l'application."
            exit 1
          fi
          if [ "$STABLE" = "true" ] && [ -z "$EXPECTED" ]; then
            echo "::warning title=Certificat::variable EXPECTED_CERT_SHA256 absente : le certificat n'est pas comparé à celui attendu."
          fi
          echo "files=${files# }" >> "$GITHUB_OUTPUT"
          echo "cert=${cert}" >> "$GITHUB_OUTPUT"
          echo "Certificat de signature (SHA-256) : \`${cert}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Effacer la clé
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks"

      - name: Publier la Release
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE: ${{ steps.signing.outputs.stable }}
          TAG_NOTES: ${{ steps.notes.outputs.file }}
        run: |
          if [ "$STABLE" = "true" ]; then
            signature="Signés avec la clé de release : la mise à jour s'installe par-dessus la version précédente (une seule exception : une version d'avant la clé de release, à désinstaller une dernière fois)."
          else
            signature="⚠️ Signés avec une clé de debug : pour installer ces APK sur un téléphone qui a déjà l'app, il faut d'abord la désinstaller."
          fi
          cat > notes.md <<EOF
          APK Android ${{ steps.version.outputs.name }} (numéro de build ${{ steps.version.outputs.code }}).

          - \`arm64-v8a\` : la plupart des téléphones.
          - \`armeabi-v7a\` : anciens téléphones 32 bits.

          ${signature}

          Certificat (SHA-256) : \`${{ steps.apk.outputs.cert }}\`
          EOF
          # Le « Quoi de neuf » du tag en tête, s'il y en a un.
          if [ -s "$TAG_NOTES" ]; then
            { cat "$TAG_NOTES"; printf '\n\n---\n\n'; cat notes.md; } > notes-full.md
            mv notes-full.md notes.md
          fi
          gh release create "$GITHUB_REF_NAME" ${{ steps.apk.outputs.files }} \
            --title "Nouvelle Vie ${{ steps.version.outputs.name }}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag

      # Le dépôt est privé : la page Releases ci-dessus rend 404 aux personnes
      # invitées. Le portail sert donc le dernier APK sur sa page publique
      # `/application` (server-portal#524), et c'est cette étape qui le lui dépose
      # — un fichier par ABI depuis #159.
      #
      # ⚠️ Elle ne fait JAMAIS échouer le workflow : la Release est déjà publiée,
      # et un portail injoignable ne doit pas la faire passer pour ratée. Tout
      # échec devient un avertissement visible dans le résumé du run — il suffit
      # alors de relancer le job, le portail acceptant de recevoir deux fois la
      # même version.
      #
      # À poser une fois (voir server-portal/deploy/README.md) :
      # - le secret `APP_RELEASE_TOKEN`, même valeur que sur le VPS ;
      # - la variable `PORTAL_URL`, facultative (défaut : le domaine de prod).
      - name: Déposer les APK sur le portail
        env:
          APP_RELEASE_TOKEN: ${{ secrets.APP_RELEASE_TOKEN }}
          PORTAL_URL: ${{ vars.PORTAL_URL || 'https://eenv.brainsial.com' }}
          VERSION: ${{ steps.version.outputs.name }}
          STABLE: ${{ steps.signing.outputs.stable }}
        run: |
          if [ -z "$APP_RELEASE_TOKEN" ]; then
            echo "::warning title=Portail::Secret APP_RELEASE_TOKEN absent : les APK n'ont pas été déposés sur le portail."
            exit 0
          fi

          # Un dépôt par ABI (#159). `signature=stable` dit au portail que la clé
          # de release a servi : sa page cesse alors de demander de désinstaller.
          #
          # armeabi-v7a d'abord, arm64-v8a ensuite : un portail d'avant #159
          # ignore `?abi=` et garde le dernier reçu sous la version — autant que
          # ce soit l'APK de la plupart des téléphones.
          signature=""
          [ "$STABLE" = "true" ] && signature="&signature=stable"
          for abi in armeabi-v7a arm64-v8a; do
            apk="nouvelle-vie-${VERSION}-${abi}.apk"
            url="${PORTAL_URL%/}/app-releases/${VERSION}?abi=${abi}${signature}"
            # Pas de réponse d'un essai précédent : un échec de connexion n'en écrit aucune.
            rm -f response.json
            code=$(curl -sS -o response.json -w '%{http_code}' \
              --max-time 900 --retry 3 --retry-delay 15 --retry-connrefused \
              -X POST \
              -H "Authorization: Bearer ${APP_RELEASE_TOKEN}" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary "@${apk}" \
              "$url") || code="000"

            case "$code" in
              200|201) ;;
              *)
                echo "::warning title=Portail::Dépôt de ${apk} sur ${url} en échec (HTTP ${code}) : $(head -c 300 response.json 2>/dev/null)"
                continue
                ;;
            esac

            # Le portail calcule l'empreinte lui-même : elle doit être celle du
            # fichier construit ici, sinon ce que la page affiche ne prouve rien.
            local_sha=$(sha256sum "$apk" | cut -d' ' -f1)
            remote_sha=$(jq -r '.sha256 // empty' response.json)
            if [ "$local_sha" != "$remote_sha" ]; then
              echo "::warning title=Portail::${apk} : empreinte différente — locale ${local_sha}, portail ${remote_sha:-absente}."
              continue
            fi
            echo "${apk} déposé ($(jq -r '.outcome' response.json)) — SHA-256 ${local_sha}"
            echo "${apk} sur le portail : ${PORTAL_URL%/}/application" >> "$GITHUB_STEP_SUMMARY"
          done

      # Le « Quoi de neuf » du tag, pour le bandeau de mise à jour du portail.
      # Après les dépôts : la version doit exister. Même règle que ci-dessus,
      # jamais d'échec — et un portail d'avant cette route répond 404.
      - name: Envoyer les notes au portail
        env:
          APP_RELEASE_TOKEN: ${{ secrets.APP_RELEASE_TOKEN }}
          PORTAL_URL: ${{ vars.PORTAL_URL || 'https://eenv.brainsial.com' }}
          VERSION: ${{ steps.version.outputs.name }}
          TAG_NOTES: ${{ steps.notes.outputs.file }}
        run: |
          # Pas de notes : rien à envoyer (pas d'effacement non plus).
          if [ ! -s "$TAG_NOTES" ] || [ -z "$APP_RELEASE_TOKEN" ]; then
            exit 0
          fi
          NOTES=$(cat "$TAG_NOTES")
          url="${PORTAL_URL%/}/app-releases/${VERSION}/notes"
          rm -f response.json
          code=$(jq -n --arg notes "$NOTES" '{notes:$notes}' \
            | curl -sS -o response.json -w '%{http_code}' \
              --max-time 60 --retry 3 --retry-delay 15 --retry-connrefused \
              -X PUT \
              -H "Authorization: Bearer ${APP_RELEASE_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @- \
              "$url") || code="000"
          case "$code" in
            200) echo "Notes envoyées au portail." ;;
            404) echo "::warning title=Notes::${url} : 404 — version inconnue, ou portail d'avant les notes de version." ;;
            *) echo "::warning title=Notes::envoi des notes sur ${url} en échec (HTTP ${code}) : $(head -c 300 response.json 2>/dev/null)" ;;
          esac

name: APK sur tag

# Un tag `vX.Y.Z` poussé construit l'APK et le publie dans une Release GitHub.
#
# **Le tag fixe la version** : `v1.2.0` donne `versionName` 1.2.0, sans toucher
# au pubspec. Le `versionCode` est le numéro de run de ce workflow : il ne fait
# que croître, ce qu'Android exige d'une mise à jour.
#
# ⚠️ **Signé avec la clé de debug** (choix du 2026-10-05, en attendant une clé de
# release). Elle est régénérée sur chaque runner : deux APK successifs ne portent
# donc PAS la même signature, et Android refuse d'installer l'un par-dessus
# l'autre. Il faut désinstaller l'app avant chaque nouvel APK — on perd alors la
# session et les téléchargements. Le jour où une clé de release existera, c'est
# `signingConfig` dans `android/app/build.gradle.kts` et ce workflow qui changent.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Construire et publier l'APK
    runs-on: ubuntu-24.04
    steps:
      - name: Lire la version dans le tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # Trois nombres, rien d'autre : `versionName` s'affiche dans « À
          # propos », et le bandeau de mise à jour compare les versions segment
          # par segment — un `1.2.0-rc1` le rendrait muet.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag « $tag » invalide : attendu vX.Y.Z (ex. v1.2.0)."
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7

      # AGP 9 exige un JDK 17 au moins ; 21 est celui de la machine de dev
      # (CLAUDE.md, « Environnement »).
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Un tag ne publie jamais ce que la CI de `main` refuserait.
      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: >
          flutter build apk --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.code }}
          --dart-define=API_BASE_URL=https://eenv.brainsial.com

      - name: Nommer l'APK
        id: apk
        run: |
          file="nouvelle-vie-${{ steps.version.outputs.name }}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Publier la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          APK Android ${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }}).

          ⚠️ Signé avec une clé de debug : pour installer cet APK sur un téléphone qui a déjà l'app, il faut d'abord la désinstaller.
          EOF
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.file }}" \
            --title "Nouvelle Vie ${{ steps.version.outputs.name }}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag

      # Le dépôt est privé : la page Releases ci-dessus rend 404 aux personnes
      # invitées. Le portail sert donc le dernier APK sur sa page publique
      # `/application` (server-portal#524), et c'est cette étape qui le lui dépose.
      #
      # ⚠️ Elle ne fait JAMAIS échouer le workflow : la Release est déjà publiée,
      # et un portail injoignable ne doit pas la faire passer pour ratée. Tout
      # échec devient un avertissement visible dans le résumé du run — il suffit
      # alors de relancer le job, le portail acceptant de recevoir deux fois la
      # même version.
      #
      # À poser une fois (voir server-portal/deploy/README.md) :
      # - le secret `APP_RELEASE_TOKEN`, même valeur que sur le VPS ;
      # - la variable `PORTAL_URL`, facultative (défaut : le domaine de prod).
      - name: Déposer l'APK sur le portail
        env:
          APP_RELEASE_TOKEN: ${{ secrets.APP_RELEASE_TOKEN }}
          PORTAL_URL: ${{ vars.PORTAL_URL || 'https://eenv.brainsial.com' }}
          APK: ${{ steps.apk.outputs.file }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          if [ -z "$APP_RELEASE_TOKEN" ]; then
            echo "::warning title=Portail::Secret APP_RELEASE_TOKEN absent : l'APK n'a pas été déposé sur le portail."
            exit 0
          fi

          url="${PORTAL_URL%/}/app-releases/${VERSION}"
          # Pas de réponse d'un essai précédent : un échec de connexion n'en écrit aucune.
          rm -f response.json
          code=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 900 --retry 3 --retry-delay 15 --retry-connrefused \
            -X POST \
            -H "Authorization: Bearer ${APP_RELEASE_TOKEN}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@${APK}" \
            "$url") || code="000"

          case "$code" in
            200|201) ;;
            *)
              echo "::warning title=Portail::Dépôt de l'APK sur ${url} en échec (HTTP ${code}) : $(head -c 300 response.json 2>/dev/null)"
              exit 0
              ;;
          esac

          # Le portail calcule l'empreinte lui-même : elle doit être celle du
          # fichier construit ici, sinon ce que la page affiche ne prouve rien.
          local_sha=$(sha256sum "$APK" | cut -d' ' -f1)
          remote_sha=$(jq -r '.sha256 // empty' response.json)
          if [ "$local_sha" != "$remote_sha" ]; then
            echo "::warning title=Portail::Empreinte différente — locale ${local_sha}, portail ${remote_sha:-absente}."
            exit 0
          fi
          echo "APK ${VERSION} déposé ($(jq -r '.outcome' response.json)) — SHA-256 ${local_sha}"
          echo "APK ${VERSION} sur le portail : ${PORTAL_URL%/}/application" >> "$GITHUB_STEP_SUMMARY"

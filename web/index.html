<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Nouvelle Vie">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Nouvelle Vie</title>
  <link rel="manifest" href="manifest.json">

  <!--
    hls.js — le lecteur HLS du web, sans lequel la médiathèque est muette hors
    Safari (voir web/WEB_ASSETS.md et lib/data/players/hls_content_player.dart).

    Servi depuis le dépôt et JAMAIS depuis un CDN, pour la même raison que
    sqlite3.wasm : une dépendance réseau tierce au démarrage est une panne de
    plus, et un point de confiance de plus.

    `defer` : le script s'exécute avant DOMContentLoaded, donc bien avant qu'un
    fidèle n'ouvre un enseignement, sans retarder le premier rendu de 617 ko.
    S'il manquait, HlsContentPlayer se rabattrait sur `<audio src>` et la panne
    remonterait à l'écran en MEDIA_ERR_SRC_NOT_SUPPORTED — pas en silence.
  -->
  <script src="hls.min.js" defer></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

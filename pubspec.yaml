name: maison_du_miracle
description: Application mobile de l'Église Évangélique Nouvelle Vie - Maison du Miracle.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  flutter_localizations:
    sdk: flutter
  intl: any
  dio: ^5.8.0
  flutter_secure_storage: ^10.3.1
  drift: 2.34.0
  drift_flutter: ^0.3.1
  # Dépôt d'image du composeur d'annonces (#36). Un plugin natif de plus, après
  # `flutter_secure_storage` et `drift` : le web reste une cible et
  # `image_picker_for_web` la couvre, macOS passe par `file_selector`. Il n'est
  # lu que derrière `StatusImagePicker` (lib/data/pickers/), pour que les tests
  # d'écran n'aient jamais à toucher la galerie de la machine.
  # iOS exige `NSPhotoLibraryUsageDescription` dans `ios/Runner/Info.plist` —
  # sans elle, l'application est **tuée** par le système à l'ouverture du
  # sélecteur, pas seulement refusée.
  image_picker: ^1.2.3
  # L'identifiant **UUIDv7 généré par le client** de la reprise de lecture
  # (#43) : `POST /teachings/:teachingId/progress` exige un `id` que le serveur
  # conserve à l'insert (ADR-0001/0018), et c'est ce qui rend le rapport
  # rejouable — un rejeu retombe sur la même ligne au lieu d'en créer une
  # seconde.
  #
  # Le paquet était déjà là, mais **en dépendance transitive** seulement
  # (`pubspec.lock`, tiré par `image_picker`). S'appuyer dessus sans le déclarer
  # est un piège classique : le jour où la dépendance intermédiaire s'en passe,
  # l'import casse au build, sans qu'aucune ligne de ce dépôt n'ait bougé.
  #
  # V7 et non V4 : l'identifiant porte son instant de création, donc trie dans
  # l'ordre d'écriture — c'est la convention d'identifiant de tout ce serveur.
  uuid: ^4.5.1
  # Le lecteur de la médiathèque (#39). Trois dépendances, une par rôle :
  #
  # - `just_audio` — le moteur HLS. **Un seul fichier du dépôt l'importe**
  #   (`lib/data/players/just_audio_content_player.dart`) : tout le reste ne
  #   connaît que `ContentPlayer`. Sous `flutter test`, `setUrl` et `dispose`
  #   lèvent `MissingPluginException` — d'où l'implémentation inerte.
  # - `audio_service` — la notification, l'écran verrouillé et le service de
  #   premier plan Android. En dépendance **directe** et non via
  #   `just_audio_background` : celui-ci n'expose que des intervalles, jamais le
  #   **choix des boutons**, et les reculs « −30 s / +30 s » sont une exigence
  #   produit (décision de #39). Le remplacer après coup réécrirait
  #   l'initialisation et le handler, pas seulement l'habillage.
  # - `audio_session` — le profil de session. `speech()` et non le défaut
  #   « musique », qui baisse le volume à chaque instruction du GPS.
  #
  # Android exige un service de premier plan déclaré et quatre permissions ;
  # iOS exige `UIBackgroundModes: audio`. Voir `AndroidManifest.xml` et
  # `Info.plist`.
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  # Le lecteur **web** (#46) n'utilise aucun des trois ci-dessus :
  # `just_audio_web` pose l'URL `.m3u8` dans un `<audio>` sans lecteur HLS, et
  # ne joue donc rien hors Safari. `HlsContentPlayer` pilote l'élément par
  # interop, et `hls.js` est **versionné dans `web/`** — aucun paquet Dart pour
  # HLS, aucun fork.
  #
  # `web` était déjà là en dépendance **transitive** (Flutter s'en sert) ; la
  # déclarer ne tire rien de neuf, c'est ce qu'exige `depend_on_referenced_packages`
  # dès qu'on l'importe soi-même. C'est le successeur de `dart:html`, retiré du
  # jeu en Dart 3.12 comme `package:js`.
  web: ^1.1.1
  # Le **menu latéral** de l'accueil (#54). Pur Dart, aucune configuration
  # native : la cible web reste tenue, contrairement aux plugins ci-dessus.
  #
  # Il est pris avec `disableDragGesture: true` **sans négociation** : son geste
  # par défaut capte le glissement horizontal sur tout l'écran principal, où
  # vivent trois carrousels et le `PageView` de la visionneuse de statuts. Le
  # menu s'ouvre par l'icône de l'accueil, et par elle seule.
  #
  # Son `androidCloseOnBackTap` n'est **pas** utilisé : il évalue sa garde
  # pendant le `build`, donc referme le tiroir à la moindre reconstruction.
  # `HomeShell` pose son propre `PopScope`.
  flutter_zoom_drawer: ^3.2.0
  # La **version et le numéro de build du binaire installé**, affichés par
  # l'entête d'« À propos » (#57). C'est la seule donnée de cet écran que le
  # serveur ne peut pas servir : elle décrit l'application posée sur ce
  # téléphone-ci, pas ce que le portail publie. Tout le reste de l'écran — la
  # présentation, la mission, le contact — arrive par le corps servi, et reste
  # donc corrigeable sans publier une version de plus.
  #
  # Plugin natif, après `flutter_secure_storage`, `drift`, `image_picker`,
  # `flutter_zoom_drawer` et les trois du lecteur. **Aucune permission requise
  # sur aucune plateforme**, contrairement à `image_picker` (iOS) et au lecteur
  # (Android) : rien à ajouter à `Info.plist` ni à `AndroidManifest.xml`. Le web
  # est couvert (`package_info_plus` y lit `version.json`), la cible reste
  # tenue.
  #
  # Lu **uniquement** derrière `AppVersionReader` (`lib/data/app_version.dart`) :
  # sous `flutter test`, un canal de plugin lève `MissingPluginException`, et
  # aucun test d'écran n'a à connaître ce détail.
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  crypto: ^3.0.7

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/animations/colombe.webp
    - assets/images/welcome_bg.webp
    - assets/images/rameau_or.webp
    - assets/images/home_header_church.webp

  fonts:
    - family: Atkinson Hyperlegible
      fonts:
        - asset: assets/fonts/Atkinson_Hyperlegible/AtkinsonHyperlegible-Regular.ttf
          weight: 400
        - asset: assets/fonts/Atkinson_Hyperlegible/AtkinsonHyperlegible-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Atkinson_Hyperlegible/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: assets/fonts/Atkinson_Hyperlegible/AtkinsonHyperlegible-BoldItalic.ttf
          weight: 700
          style: italic

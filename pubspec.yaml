name: maison_du_miracle
description: Application mobile de l'Église Évangélique Nouvelle Vie - Maison du Miracle.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  flutter_localizations:
    sdk: flutter
  intl: any
  dio: ^5.8.0
  flutter_secure_storage: ^10.3.1
  drift: 2.34.0
  drift_flutter: ^0.3.1
  # Dépôt d'image du composeur d'annonces (#36). Un plugin natif de plus, après
  # `flutter_secure_storage` et `drift` : le web reste une cible et
  # `image_picker_for_web` la couvre, macOS passe par `file_selector`. Il n'est
  # lu que derrière `StatusImagePicker` (lib/data/pickers/), pour que les tests
  # d'écran n'aient jamais à toucher la galerie de la machine.
  # iOS exige `NSPhotoLibraryUsageDescription` dans `ios/Runner/Info.plist` —
  # sans elle, l'application est **tuée** par le système à l'ouverture du
  # sélecteur, pas seulement refusée.
  image_picker: ^1.2.3
  # L'identifiant **UUIDv7 généré par le client** de la reprise de lecture
  # (#43) : `POST /teachings/:teachingId/progress` exige un `id` que le serveur
  # conserve à l'insert (ADR-0001/0018), et c'est ce qui rend le rapport
  # rejouable — un rejeu retombe sur la même ligne au lieu d'en créer une
  # seconde.
  #
  # Le paquet était déjà là, mais **en dépendance transitive** seulement
  # (`pubspec.lock`, tiré par `image_picker`). S'appuyer dessus sans le déclarer
  # est un piège classique : le jour où la dépendance intermédiaire s'en passe,
  # l'import casse au build, sans qu'aucune ligne de ce dépôt n'ait bougé.
  #
  # V7 et non V4 : l'identifiant porte son instant de création, donc trie dans
  # l'ordre d'écriture — c'est la convention d'identifiant de tout ce serveur.
  uuid: ^4.5.1
  # Le lecteur de la médiathèque (#39). Trois dépendances, une par rôle :
  #
  # - `just_audio` — le moteur HLS. **Un seul fichier du dépôt l'importe**
  #   (`lib/data/players/just_audio_content_player.dart`) : tout le reste ne
  #   connaît que `ContentPlayer`. Sous `flutter test`, `setUrl` et `dispose`
  #   lèvent `MissingPluginException` — d'où l'implémentation inerte.
  # - `audio_service` — la notification, l'écran verrouillé et le service de
  #   premier plan Android. En dépendance **directe** et non via
  #   `just_audio_background` : celui-ci n'expose que des intervalles, jamais le
  #   **choix des boutons**, et les reculs « −30 s / +30 s » sont une exigence
  #   produit (décision de #39). Le remplacer après coup réécrirait
  #   l'initialisation et le handler, pas seulement l'habillage.
  # - `audio_session` — le profil de session. `speech()` et non le défaut
  #   « musique », qui baisse le volume à chaque instruction du GPS.
  #
  # Android exige un service de premier plan déclaré et quatre permissions ;
  # iOS exige `UIBackgroundModes: audio`. Voir `AndroidManifest.xml` et
  # `Info.plist`.
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  # **La vidéo des statuts** (#130, tranche 4/4 de « Sparks »). Le profil
  # `sparks` du transcodeur sert une playlist HLS maître à deux rendus ;
  # `video_player` la lit nativement des deux côtés (ExoPlayer + HLS sur
  # Android, AVPlayer sur iOS). L'audio des statuts, lui, passe par
  # `just_audio`, déjà là.
  #
  # **Un seul fichier du dépôt l'importe** (`lib/data/players/
  # media_status_player.dart`), derrière `StatusPlayer` : sous `flutter test`
  # son canal lève `MissingPluginException`, et les tests gardent
  # `FakeStatusPlayer` / `InertStatusPlayer`. Un test de source le vérifie.
  #
  # **Swift Package** (`darwin/video_player_avfoundation/Package.swift`) :
  # CocoaPods ne ressuscite pas. **Aucune permission** sur aucune plateforme ;
  # Android déclare `INTERNET` dans le manifeste du greffon, et les URL servies
  # sont en HTTPS — ni `usesCleartextTraffic` ni `NSAppTransportSecurity`.
  # Sur le web, il n'est pas monté : `main.dart` garde `FakeStatusPlayer`
  # (le `<video>` de Chrome ne lit pas le HLS, comme le `<audio>` de #46).
  video_player: ^2.11.1
  # Le lecteur **web** (#46) n'utilise aucun des trois ci-dessus :
  # `just_audio_web` pose l'URL `.m3u8` dans un `<audio>` sans lecteur HLS, et
  # ne joue donc rien hors Safari. `HlsContentPlayer` pilote l'élément par
  # interop, et `hls.js` est **versionné dans `web/`** — aucun paquet Dart pour
  # HLS, aucun fork.
  #
  # `web` était déjà là en dépendance **transitive** (Flutter s'en sert) ; la
  # déclarer ne tire rien de neuf, c'est ce qu'exige `depend_on_referenced_packages`
  # dès qu'on l'importe soi-même. C'est le successeur de `dart:html`, retiré du
  # jeu en Dart 3.12 comme `package:js`.
  web: ^1.1.1
  # Le **menu latéral** de l'accueil (#54). Pur Dart, aucune configuration
  # native : la cible web reste tenue, contrairement aux plugins ci-dessus.
  #
  # Il est pris avec `disableDragGesture: true` **sans négociation** : son geste
  # par défaut capte le glissement horizontal sur tout l'écran principal, où
  # vivent trois carrousels et le `PageView` de la visionneuse de statuts. Le
  # menu s'ouvre par l'icône de l'accueil, et par elle seule.
  #
  # Son `androidCloseOnBackTap` n'est **pas** utilisé : il évalue sa garde
  # pendant le `build`, donc referme le tiroir à la moindre reconstruction.
  # `HomeShell` pose son propre `PopScope`.
  flutter_zoom_drawer: ^3.2.0
  # La **version et le numéro de build du binaire installé**, affichés par
  # l'entête d'« À propos » (#57). C'est la seule donnée de cet écran que le
  # serveur ne peut pas servir : elle décrit l'application posée sur ce
  # téléphone-ci, pas ce que le portail publie. Tout le reste de l'écran — la
  # présentation, la mission, le contact — arrive par le corps servi, et reste
  # donc corrigeable sans publier une version de plus.
  #
  # Plugin natif, après `flutter_secure_storage`, `drift`, `image_picker`,
  # `flutter_zoom_drawer` et les trois du lecteur. **Aucune permission requise
  # sur aucune plateforme**, contrairement à `image_picker` (iOS) et au lecteur
  # (Android) : rien à ajouter à `Info.plist` ni à `AndroidManifest.xml`. Le web
  # est couvert (`package_info_plus` y lit `version.json`), la cible reste
  # tenue.
  #
  # Lu **uniquement** derrière `AppVersionReader` (`lib/data/app_version.dart`) :
  # sous `flutter test`, un canal de plugin lève `MissingPluginException`, et
  # aucun test d'écran n'a à connaître ce détail.
  #
  # ^10 (et non plus ^9) depuis M4 : `geolocator` ≥ 14.0.3 tire
  # `geolocator_linux` 0.2.6, qui exige `package_info_plus` ^10. La 10 demande
  # Flutter ≥ 3.38.1 et iOS 13 — la CI est en 3.44.2, le projet en iOS 15.
  package_info_plus: ^10.2.2
  # **Le type de transport**, et rien d'autre : wifi ou données mobiles. C'est
  # ce qui permet au réglage « Automatique » de la qualité d'écoute de plafonner
  # le débit hors wifi (`NetworkTransport`, `lib/data/network/`).
  #
  # `CLAUDE.md` écarte ce paquet ailleurs, et la réserve **reste valable là où
  # elle a été écrite** : pour savoir si l'appareil a vraiment internet, il ment
  # — il répond « connecté » derrière un portail captif, c'est-à-dire exactement
  # quand sa réponse compterait. La panne d'écoute se déduit donc toujours de
  # l'échec lui-même, jamais d'ici.
  #
  # Lire *par quel tuyau* on passe est une autre question, et il y est fiable :
  # c'est l'OS qui le dit, sans aller-retour réseau. **Aucune permission** n'est
  # requise, ni sur iOS ni sur Android (Android déclare `ACCESS_NETWORK_STATE`
  # dans le manifeste du greffon, sans invite utilisateur). Le web est couvert,
  # en mode dégradé : le navigateur ne distingue pas toujours wifi et cellulaire
  # et rend `unknown` — traité comme « pas de données mobiles », donc sans
  # bridage, ce qui est le bon défaut sur un ordinateur.
  #
  # Lu **uniquement** derrière `NetworkTransport`, comme `image_picker` derrière
  # `StatusImagePicker` : les tests posent un transport figé, sans canal de
  # plugin.
  # `path_provider` — le **dossier de cache du fond des lecteurs**, et rien
  # d'autre. Déjà présent en transitif (drift_flutter, background_downloader,
  # just_audio) ; déclaré parce qu'on l'importe soi-même, comme `web`. Aucune
  # permission sur aucune plateforme. Lu **uniquement** derrière
  # `SeasonBackgroundStore` (`lib/data/backgrounds/`), qui rattrape tout :
  # sous `flutter test` le canal de plugin n'existe pas, et un lecteur monté
  # dans un test ne doit pas rougir pour un décor.
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.1

  # Enregistrement d'un média partagé dans la galerie Photos (visionneuse des
  # échanges). Choisi pour son support **Swift Package Manager** (pas de retour
  # de CocoaPods) et son API save-only. Les octets sont d'abord récupérés via
  # `dio`, puis remis à `Gal.putImageBytes`.
  #
  # Permissions : iOS exige `NSPhotoLibraryAddUsageDescription` (ajout seul) dans
  # `Info.plist` ; Android déclare `WRITE_EXTERNAL_STORAGE` (maxSdkVersion 29).
  # **Pas de support web** : l'appel est gardé par `kIsWeb` derrière
  # `MediaSaver` (`lib/data/media/`) — les tests posent un enregistreur inerte,
  # sans canal de plugin, comme `image_picker` derrière `StatusImagePicker`.
  gal: ^2.3.3
  # **Le moteur de téléchargement en tâche de fond** (#190) — les enseignements
  # écoutables hors ligne. Choisi pour ce qu'aucun `dio` + fichier ne donne : un
  # transfert qui **survit à la mise en arrière-plan et au kill de l'app**
  # (F7), reprenable par `Range`, avec contrainte réseau (wifi par défaut, F8) et
  # notification de progression native.
  #
  # Plugin natif, après les autres. **Un seul fichier du dépôt l'importe**
  # (`lib/data/downloads/background_downloader_backend.dart`) : tout le reste ne
  # connaît que `DownloadBackend` (`lib/data/downloads/download_backend.dart`),
  # exactement comme `just_audio` derrière `ContentPlayer`. Sous `flutter test`,
  # ses canaux natifs lèvent — d'où l'abstraction et son double `Fake`.
  #
  # Configuration native :
  # - **iOS** — le plugin télécharge via `URLSession` en arrière-plan ; le mode
  #   `UIBackgroundModes: audio` déjà présent pour le lecteur **ne suffit pas** au
  #   transfert seul, mais le plugin s'appuie sur sa propre `URLSession`
  #   « background » sans exiger d'entrée `UIBackgroundModes` supplémentaire
  #   (contrairement à `fetch`/`processing`). Rien à ajouter à `Info.plist`.
  # - **Android** — notification de progression : `POST_NOTIFICATIONS` (API 33+,
  #   déjà demandée à l'exécution pour le lecteur) et le service de premier plan
  #   `dataSync` du plugin, déclarés dans `AndroidManifest.xml`.
  background_downloader: ^9.2.0
  # **Le réveil push** (#97) — PRD `server-portal/docs/prd/notifications-push.md`.
  # Trois dépendances, une par rôle, et la frontière entre elles est le sujet de
  # `lib/data/push/` :
  #
  # - `firebase_core` — l'application Firebase. Lue par `firebase_options.dart`
  #   (écrit **à la main** : `flutterfire` n'est pas installé, et sa commande exige
  #   de toute façon une authentification Google interactive) et par le choix de
  #   transport de `main.dart`.
  # - `firebase_messaging` — le transport FCM. **Un seul fichier du dépôt
  #   l'importe** (`lib/data/push/fcm_push_transport.dart`), plus `main.dart` qui
  #   choisit : tout le reste ne connaît que `PushTransport`, exactement comme
  #   `just_audio` derrière `ContentPlayer`. C'est cette couture qui fera de la
  #   tranche 4 (UnifiedPush, #99) une **addition** et non une refonte, et
  #   `test/data/push/push_seam_test.dart` la vérifie sur la source.
  # - `flutter_local_notifications` — la notification **locale** de D6. Le push est
  #   silencieux et ne porte aucun contenu (ADR-0006) : le texte affiché est lu
  #   dans le magasin Drift, jamais dans la charge utile. Confiné derrière
  #   `WakeNotifier` / `WakeTaps`.
  #
  # Configuration native :
  # - **Android** — le greffon Gradle `com.google.gms.google-services`
  #   (`settings.gradle.kts` + `app/build.gradle.kts`) et `app/google-services.json`.
  #   Il n'est **pas** facultatif malgré les options passées côté Dart : le service
  #   natif de FCM démarre avant tout code Dart quand un réveil arrive sur une
  #   application fermée. `POST_NOTIFICATIONS` est déjà déclarée et déjà demandée à
  #   l'exécution pour le lecteur — c'est la **même** permission, et la redemander
  #   poserait deux fenêtres l'une sur l'autre.
  # - **iOS** — `GoogleService-Info.plist` dans la cible Runner,
  #   `UIBackgroundModes: remote-notification`, `Runner.entitlements` avec
  #   `aps-environment`. Les trois paquets sont des **Swift Packages** : CocoaPods
  #   ne ressuscite pas. ⚠️ Et **aucun push n'arrivera sur iPhone** tant qu'il n'y
  #   a pas de clé APNs (compte Apple Developer Program) — ce n'est pas un défaut
  #   du code, c'est le prérequis §6 du PRD.
  # - **web** — rien, et c'est voulu : aucune application web n'est déclarée dans
  #   le projet Firebase, et `main.dart` écarte le web **avant**
  #   `Firebase.initializeApp()`. `firebase_core_web` ne descend donc jamais le SDK
  #   JS de `gstatic.com`, et la règle « aucun CDN » tient.
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  # **Les médias de la messagerie** (M4, #143 — reprend #98). « Le téléphone
  # dégrade, le serveur borne » : tout ce qui part est encodé ou compressé ici.
  # Chaque greffon est lu derrière **une couture** (`lib/data/messaging/media/`,
  # `lib/data/players/`), inerte dans les tests. Tous sont des **Swift
  # Packages** (CocoaPods ne ressuscite pas) et maintenus en 2026.
  #
  # - `record` — l'enregistreur de vocaux : AAC mono 32 kbit/s natif, gain
  #   automatique (le niveau normalisé du cadrage). Un seul fichier l'importe
  #   (`record_voice_recorder.dart`). `RECORD_AUDIO` / `NSMicrophoneUsage…`.
  # - `image` — **pur Dart** : décoder, cuire l'orientation, ramener à 1600 px,
  #   **retirer l'EXIF** (la position GPS de la prise de vue) et réencoder en
  #   JPEG q80. Pur Dart, donc **testable** sur de vrais octets.
  # - `v_video_compressor` — la vidéo compressée sur l'appareil (H.264, 720p,
  #   métadonnées retirées) et sa vignette. Préféré à `video_compress`, plus
  #   connu mais figé depuis 2025 et CocoaPods seulement.
  # - `file_picker` — un document ou un fichier audio, par le sélecteur du
  #   système (aucune permission).
  # - `geolocator` — la position, demandée **au geste** (`ACCESS_FINE_LOCATION`,
  #   `NSLocationWhenInUse…`).
  # - `flutter_native_contact_picker` — **un** contact, par le sélecteur du
  #   système : aucune permission de lecture du carnet, l'application ne voit
  #   que le contact choisi (plan §4).
  # - `url_launcher` — ouvrir une position dans l'application de cartes (aucune
  #   clé d'API, aucune carte statique payante), un numéro dans le composeur, et
  #   les liens `externe` du menu (`UrlLauncherExternalLinkLauncher`).
  # - `open_file` — ouvrir un document reçu dans l'application du système.
  #   Préféré à `open_filex`, CocoaPods seulement.
  record: ^7.1.1
  image: ^4.10.1
  v_video_compressor: ^2.2.3
  file_picker: ^13.1.0
  geolocator: ^14.1.1
  flutter_native_contact_picker: ^0.0.12
  url_launcher: ^6.3.3
  open_file: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  crypto: ^3.0.7

# **Copie modifiée de just_audio 0.10.6** : elle ajoute `programTimeMs()`,
# l'heure de programme (EXT-X-PROGRAM-DATE-TIME) de ce qu'on entend — le
# direct aligné sur l'écoute (mobile#187). Écarts et montée de version :
# `third_party/just_audio/NOUVELLE_VIE.md`.
dependency_overrides:
  just_audio:
    path: third_party/just_audio

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/brand_logo.webp
    - assets/images/brand_logo_inverse.webp
    - assets/images/rameau_or.webp
    - assets/images/live_bg.png
    - assets/images/home_header_church.webp

  fonts:
    - family: Atkinson Hyperlegible
      fonts:
        - asset: assets/fonts/Atkinson_Hyperlegible/AtkinsonHyperlegible-Regular.ttf
          weight: 400
        - asset: assets/fonts/Atkinson_Hyperlegible/AtkinsonHyperlegible-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Atkinson_Hyperlegible/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: assets/fonts/Atkinson_Hyperlegible/AtkinsonHyperlegible-BoldItalic.ttf
          weight: 700
          style: italic
